# Sa-Token 配置
sa-token.token-name: satoken
sa-token.timeout: 2592000  # token 有效期（秒），默认 30 天
sa-token.active-timeout: -1 # token 最低活跃频率（秒），如果 token 超过这个时间没有访问系统就会被冻结，默认-1 代表不限制
sa-token.is-concurrent: true # 是否允许同一账号并发登录（为 true 时允许一起登录，为 false 时新登录会挤下旧登录）
sa-token.is-share: true # 在多人登录同一账号时，是否共用一个 token（为 true 时所有登录共用一个 token，为 false 时每次登录新建一个 token）
sa-token.token-style: uuid # token 风格（uuid）
sa-token.is-log: false # 是否输出操作日志
sa-token.is-read-cookie: true # 是否从 cookie 中读取 token
sa-token.is-read-header: true # 是否从 header 中读取 token


