server.port: 10001
spring.application.name: KnowEngine

# 大模型对话中文乱码UTF8编码处理
server.servlet.encoding.enabled: true
server.servlet.encoding.force: true
server.servlet.encoding.charset: UTF-8

# 文件上传配置
spring.servlet.multipart.enabled: true
spring.servlet.multipart.max-file-size: 100MB
spring.servlet.multipart.max-request-size: 100MB

# Tika 正文提取上限，防止异常文档产生过大的内存占用
tika.max-text-length: 5000000

# langchain4j 模型配置
langchain4j.open-ai.chat-model.api-key: @dashscope.api.key@
langchain4j.open-ai.chat-model.model-name: deepseek-r1
langchain4j.open-ai.chat-model.base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.chat-model.log-requests: true
langchain4j.open-ai.chat-model.log-responses: true

langchain4j.open-ai.streaming-chat-model.api-key: @dashscope.api.key@
langchain4j.open-ai.streaming-chat-model.model-name: deepseek-r1
langchain4j.open-ai.streaming-chat-model.base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
langchain4j.open-ai.streaming-chat-model.log-requests: true
langchain4j.open-ai.streaming-chat-model.log-responses: true

