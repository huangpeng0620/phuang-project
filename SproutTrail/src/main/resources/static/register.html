<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="注册 SproutTrail 图片创作账号" />
    <title>注册 · SproutTrail</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card" aria-labelledby="register-title">
        <a class="brand" href="/login.html" aria-label="SproutTrail 登录页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M16 25V14" />
              <path d="M16 17C11 17 8 14 8 9c5 0 8 3 8 8Z" />
              <path d="M16 13c0-5 3-8 8-8 0 5-3 8-8 8Z" />
            </svg>
          </span>
          <span>SproutTrail</span>
        </a>

        <div class="login-heading">
          <span class="eyebrow">START CREATING</span>
          <h1 id="register-title">创建账号</h1>
          <p>注册后即可进入图片创作工作台。</p>
        </div>

        <form id="register-form">
          <label class="field-label" for="username">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 minlength="3" maxlength="64" placeholder="3～64 个字符" required />

          <label class="field-label password-label" for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="new-password"
                 minlength="8" maxlength="72" placeholder="至少 8 个字符" required />

          <label class="field-label password-label" for="confirm-password">确认密码</label>
          <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password"
                 minlength="8" maxlength="72" placeholder="再次输入密码" required />

          <p class="login-error" id="register-error" role="alert" aria-live="polite"></p>
          <button class="login-button" id="register-button" type="submit">
            <span>创建账号</span>
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <p class="login-success" id="register-success" role="status" aria-live="polite" hidden>
          注册成功，请<a class="auth-link" href="/login.html">前往登录</a>。
        </p>

        <p class="login-footnote">已有账号？<a class="auth-link" href="/login.html">返回登录</a></p>
      </section>
      <div class="ambient-shape ambient-shape-one" aria-hidden="true"></div>
      <div class="ambient-shape ambient-shape-two" aria-hidden="true"></div>
    </main>
    <script src="register.js"></script>
  </body>
</html>
