<!doctype html>
<html lang="zh-CN" class="auth-checking">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="查看和管理我的图片生成记录" />
    <title>我的图片 · SproutTrail</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="history.css" />
  </head>
  <body>
    <div class="page-shell history-page">
      <header class="topbar">
        <a class="brand" href="/" aria-label="SproutTrail 创作工作台">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M16 25V14" />
              <path d="M16 17C11 17 8 14 8 9c5 0 8 3 8 8Z" />
              <path d="M16 13c0-5 3-8 8-8 0 5-3 8-8 8Z" />
            </svg>
          </span>
          <span>SproutTrail</span>
        </a>
        <div class="topbar-actions">
          <a class="history-link" href="/">继续创作</a>
          <span class="current-user" id="current-user" aria-live="polite"></span>
          <button class="logout-button" id="logout-button" type="button">退出登录</button>
        </div>
      </header>

      <main class="history-main">
        <div class="history-heading">
          <div>
            <div class="eyebrow">YOUR IMAGE LIBRARY</div>
            <h1>我的图片</h1>
            <p>查看你生成和优化过的图片，并复制提示词或下载结果。</p>
          </div>
          <a class="history-create-button" href="/">＋ 新建图片</a>
        </div>

        <div class="history-tabs" role="tablist" aria-label="图片记录类型">
          <button class="history-tab is-active" id="generation-tab" type="button" role="tab"
                  aria-selected="true" aria-controls="history-grid" data-history-type="generation">
            文生图
          </button>
          <button class="history-tab" id="optimization-tab" type="button" role="tab"
                  aria-selected="false" aria-controls="history-grid" data-history-type="optimization">
            图片优化
          </button>
        </div>

        <p class="history-status" id="history-status" role="status" aria-live="polite">正在加载图片记录…</p>
        <p class="history-error" id="history-error" role="alert" hidden></p>
        <section class="history-grid" id="history-grid" role="tabpanel"
                 aria-labelledby="generation-tab" aria-label="我的图片列表"></section>
        <section class="history-empty" id="history-empty" hidden>
          <div class="history-empty-icon" aria-hidden="true">✧</div>
          <h2 id="history-empty-title">这里还没有图片</h2>
          <p id="history-empty-message">当前账号暂无文生图记录。</p>
          <a class="history-create-button" href="/">开始创作</a>
        </section>
        <button class="history-load-more" id="history-load-more" type="button" hidden>加载更多</button>
      </main>
    </div>
    <script src="history.js"></script>
  </body>
</html>
